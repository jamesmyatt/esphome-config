defaults:
  activity_led: activity_led
  flash_length: 500ms
  flash_brightness: 100%
  i2c_bus: bus_i2c

packages:
  - !include
    file: tagreader.yaml
    vars:
      activity_led: ${activity_led}
      flash_length: ${flash_length}
      flash_brightness: ${flash_brightness}

pn532_i2c:
  - id: pn532_board
    i2c_id: ${i2c_bus}
    update_interval: 1s
    on_tag:
      - then:
          - lambda: |-
              id(nfc_uid) = x;
              id(ha_tag_id) = get_ha_tag_ndef(tag);
              id(tag_reader).execute();
