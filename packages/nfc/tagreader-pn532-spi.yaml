defaults:
  activity_led: activity_led
  flash_length: 500ms
  spi_bus: bus_spi
  cs_pin: null

packages:
  - !include
    file: tagreader.yaml
    vars:
      activity_led: ${activity_led}
      flash_length: ${flash_length}

pn532_spi:
  - id: pn532_board
    spi_id: ${spi_bus}
    cs_pin: ${cs_pin}
    update_interval: 1s
    on_tag:
      - then:
          - lambda: |-
              id(nfc_uid) = x;
              id(nfc_tag) = tag;
              id(tag_reader).execute();
