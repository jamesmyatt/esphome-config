defaults:
  activity_led: activity_led
  flash_length: 500ms
  flash_brightness: 100%

event:
  - platform: template
    id: tag_scanned
    name: Tag scanned
    icon: mdi:button-pointer
    event_types:
      - generic
      - homeassistant

esphome:
  comment: NFC Tag Reader

globals:
  - id: nfc_uid
    type: std::string
  - id: ha_tag_id
    type: std::string

text_sensor:
  - platform: template
    name: "RFID Tag UID"
    id: tag_uid
    icon: mdi:nfc
    entity_category: diagnostic
  - platform: template
    name: "Home Assistant Tag ID"
    id: tag_id
    icon: mdi:nfc-variant
    entity_category: diagnostic

script:
  - id: tag_reader
    mode: single
    then:
      # Send tag data
      - text_sensor.template.publish:
          id: tag_uid
          state: !lambda "return id(nfc_uid);"
      - text_sensor.template.publish:
          id: tag_id
          state: !lambda "return id(ha_tag_id);"
      - if:
          condition:
            - lambda: 'return id(ha_tag_id) != "";'
          then:
            - event.trigger:
                id: tag_scanned
                event_type: homeassistant
            - homeassistant.tag_scanned: !lambda "return id(ha_tag_id);"
            - # Flash home assistant blue for Home Assistant tag
              light.turn_on:
                id: "${activity_led}"
                brightness: "${flash_brightness}"
                red: 9%
                green: 74%
                blue: 100%
                flash_length: "${flash_length}"
          else:
            - event.trigger:
                id: tag_scanned
                event_type: generic
            - # Flash bright orange for generic tag
              light.turn_on:
                id: "${activity_led}"
                brightness: "${flash_brightness}"
                red: 100%
                green: 60%
                blue: 11%
                flash_length: "${flash_length}"
