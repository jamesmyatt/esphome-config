        name: Target-1 Y
        device_id: ${ld2450_device_id}
      speed:
        id: ${ld2450_id}_target1_speed
        name: Target-1 Speed
        device_id: ${ld2450_device_id}
      angle:
        id: ${ld2450_id}_target1_angle
        name: Target-1 Angle
        device_id: ${ld2450_device_id}
      distance:
        id: ${ld2450_id}_target1_distance
        name: Target-1 Distance
        device_id: ${ld2450_device_id}
      resolution:
        id: ${ld2450_id}_target1_resolution
        name: Target-1 Resolution
        device_id: ${ld2450_device_id}
    target_2:
