defaults:
  pin_green: null # must be defined
  pin_red: null # must be defined
  pin_blue: null # must be defined
  pin_white: null # must be defined
  id_light: light_rgbw
  ledc_freq: 4882Hz # 14-bit

output:
  - id: ${id_light}_g
    platform: ledc
    pin: ${pin_green}
    frequency: ${ledc_freq}
    phase_angle: 90°
  - id: ${id_light}_r
    platform: ledc
    pin: ${pin_red}
    frequency: ${ledc_freq}
    phase_angle: 180°
  - id: ${id_light}_b
    platform: ledc
    pin: ${pin_blue}
    frequency: ${ledc_freq}
    phase_angle: 270°
  - id: ${id_light}_w
    platform: ledc
    pin: ${pin_white}
    frequency: ${ledc_freq}
    phase_angle: 0°

light:
  - id: ${id_light}
    platform: rgbw
    name: Light
    red: ${id_light}_r
    green: ${id_light}_g
    blue: ${id_light}_b
    white: ${id_light}_w
    color_interlock: false
    restore_mode: RESTORE_DEFAULT_OFF
