defaults:
  pin_ch1: null # must be defined
  pin_ch2: null # must be defined
  pin_ch3: null # must be defined
  pin_ch4: null # must be defined
  id_light: light
  ledc_freq: 4882Hz # 14-bit

output:
  - id: ${id_light}_ch1_out
    platform: ledc
    pin: ${pin_ch1}
    frequency: ${ledc_freq}
    phase_angle: 0°
  - id: ${id_light}_ch2_out
    platform: ledc
    pin: ${pin_ch2}
    frequency: ${ledc_freq}
    phase_angle: 90°
  - id: ${id_light}_ch3_out
    platform: ledc
    pin: ${pin_ch3}
    frequency: ${ledc_freq}
    phase_angle: 180°
  - id: ${id_light}_ch4_out
    platform: ledc
    pin: ${pin_ch4}
    frequency: ${ledc_freq}
    phase_angle: 270°

light:
  - id: ${id_light}_ch1
    platform: monochromatic
    output: ${id_light}_ch1_out
    name: "Ch1"
    restore_mode: RESTORE_DEFAULT_OFF
  - id: ${id_light}_ch2
    platform: monochromatic
    output: ${id_light}_ch2_out
    name: "Ch2"
    restore_mode: RESTORE_DEFAULT_OFF
  - id: ${id_light}_ch3
    platform: monochromatic
    output: ${id_light}_ch3_out
    name: "Ch3"
    restore_mode: RESTORE_DEFAULT_OFF
  - id: ${id_light}_ch4
    platform: monochromatic
    output: ${id_light}_ch4_out
    name: "Ch4"
    restore_mode: RESTORE_DEFAULT_OFF
