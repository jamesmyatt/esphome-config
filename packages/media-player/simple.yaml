# Examples
#  - https://esphome.io/components/media_player/speaker/
#  - https://github.com/esphome/media-players/blob/main/m5stack/m5stack-atom-echo.yaml

defaults:
  speaker_id: external_speaker
  media_player_id: external_media_player
  media_format: OPUS # OPUS is the least network intensive codec
  num_channels: 1 # not actually used

media_player:
  - id: ${media_player_id}
    platform: speaker
    name: Media Player
    announcement_pipeline:
      speaker: ${speaker_id}
      format: ${media_format}
      num_channels: 1 # Stereo audio is unnecessary for announcements
      sample_rate: 16000 # low sample rate
