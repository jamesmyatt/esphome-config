# Note that ir_rx_pin is usually inverted
defaults:
  ir_rx_id: ir_rx
  ir_rx_pin: null

remote_receiver:
  - id: ${ir_rx_id}
    pin: ${ir_rx_pin}
    # tolerance: 55%
    dump: [] # doesn't affect proxy

infrared:
  - id: ${ir_rx_id}_proxy
    platform: ir_rf_proxy
    name: IR Receiver
    receiver_frequency: 38kHz
    remote_receiver_id: ${ir_rx_id}
