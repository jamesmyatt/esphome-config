<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>TYSW-012 IR receiver</title>
  <rect width="720" height="440" fill="#ffffff"/>

  <text x="24" y="34" font-size="16" font-weight="bold" fill="#111827">TYSW-012 · IR receiver (U2)</text>
  <text x="24" y="54" font-size="12" fill="#6b7280">Redrawn from the Tuya schematic</text>

  <g stroke="#1f2937" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- U2 -->
    <rect x="60" y="120" width="110" height="120" fill="#fefce8"/>
    <line x1="170" y1="150" x2="200" y2="150"/>
    <line x1="170" y1="210" x2="200" y2="210"/>
    <line x1="115" y1="240" x2="115" y2="280"/>
    <!-- U2 ground -->
    <line x1="101" y1="280" x2="129" y2="280"/>
    <line x1="107" y1="286" x2="123" y2="286"/>
    <line x1="112" y1="292" x2="118" y2="292"/>

    <!-- OUT net -->
    <line x1="200" y1="150" x2="560" y2="150"/>
    <!-- R7 pull-up -->
    <line x1="380" y1="150" x2="380" y2="130"/>
    <polyline points="380,130 388,126 372,118 388,110 372,102 388,94 372,86 380,82"/>
    <line x1="380" y1="82" x2="380" y2="62"/>
    <line x1="366" y1="62" x2="394" y2="62" stroke="#b91c1c"/>
    <!-- IO5 net flag -->
    <polygon points="560,140 600,140 612,150 600,160 560,160" fill="#eff6ff" stroke="#1d4ed8"/>

    <!-- VCC net -->
    <line x1="200" y1="210" x2="470" y2="210"/>
    <!-- R8 -->
    <polyline points="470,210 474,202 482,218 490,202 498,218 506,202 514,218 522,202 530,218 538,202 546,218 550,210"/>
    <line x1="550" y1="210" x2="610" y2="210"/>
    <line x1="610" y1="210" x2="610" y2="186"/>
    <line x1="596" y1="186" x2="624" y2="186" stroke="#b91c1c"/>

    <!-- C9 -->
    <line x1="300" y1="210" x2="300" y2="255"/>
    <line x1="286" y1="255" x2="314" y2="255"/>
    <line x1="286" y1="265" x2="314" y2="265"/>
    <line x1="300" y1="265" x2="300" y2="320"/>
    <!-- C10 (polarised) -->
    <line x1="420" y1="210" x2="420" y2="255"/>
    <line x1="406" y1="255" x2="434" y2="255"/>
    <path d="M406,270 Q420,260 434,270"/>
    <line x1="420" y1="265" x2="420" y2="320"/>
    <!-- GND bus -->
    <line x1="300" y1="320" x2="420" y2="320"/>
    <line x1="360" y1="320" x2="360" y2="336"/>
    <line x1="346" y1="336" x2="374" y2="336"/>
    <line x1="352" y1="342" x2="368" y2="342"/>
    <line x1="357" y1="348" x2="363" y2="348"/>
  </g>

  <!-- junctions -->
  <g fill="#1f2937">
    <circle cx="380" cy="150" r="4"/>
    <circle cx="300" cy="210" r="4"/>
    <circle cx="420" cy="210" r="4"/>
    <circle cx="360" cy="320" r="4"/>
  </g>

  <!-- U2 labels -->
  <text x="60" y="112" font-weight="bold" fill="#111827">U2</text>
  <text x="60" y="318" font-size="12" fill="#374151">38 kHz IR receiver</text>
  <text x="162" y="155" text-anchor="end" fill="#111827">OUT</text>
  <text x="162" y="215" text-anchor="end" fill="#111827">VCC</text>
  <text x="115" y="233" text-anchor="middle" fill="#111827">GND</text>
  <g font-size="11" fill="#6b7280">
    <text x="185" y="144" text-anchor="middle">1</text>
    <text x="123" y="258">2</text>
    <text x="185" y="204" text-anchor="middle">3</text>
  </g>

  <!-- component labels -->
  <text x="398" y="102" font-weight="bold" fill="#111827">R7</text>
  <text x="398" y="118" fill="#374151">10 kΩ</text>
  <text x="380" y="52" text-anchor="middle" fill="#b91c1c">VDD3V3</text>

  <text x="510" y="190" text-anchor="middle" fill="#111827"><tspan font-weight="bold">R8</tspan> 100 Ω</text>
  <text x="610" y="176" text-anchor="middle" fill="#b91c1c">5VF</text>

  <text x="280" y="258" text-anchor="end" font-weight="bold" fill="#111827">C9</text>
  <text x="280" y="274" text-anchor="end" fill="#374151">100 nF</text>
  <text x="409" y="250" font-size="12" fill="#111827">+</text>
  <text x="442" y="258" font-weight="bold" fill="#111827">C10</text>
  <text x="442" y="274" fill="#374151">47 µF *</text>

  <text x="586" y="155" text-anchor="middle" font-weight="bold" fill="#1d4ed8">IO5</text>
  <text x="560" y="130" font-size="11" fill="#6b7280">to MCU · also TP5</text>

  <!-- notes -->
  <g font-size="12" fill="#374151">
    <text x="24" y="384">R8 + C9/C10 filter the receiver's 5 V supply.</text>
    <text x="24" y="402">R7 pulls OUT up to 3.3 V. OUT is active low (idles high).</text>
    <text x="24" y="420" fill="#6b7280">* C10 is a tantalum capacitor marked 476 (47 µF) on the board. The schematic image is hard to read here.</text>
  </g>
</svg>
