  <text x="490" y="58" text-anchor="middle" fill="#b91c1c">5VF</text>
  <text x="79" y="135" font-size="12" fill="#111827">+</text>
  <text x="110" y="143" font-weight="bold" fill="#111827">C8</text>
  <text x="110" y="159" fill="#111827">470 µF</text>
  <text x="234" y="122" font-weight="bold" fill="#111827">R6</text>
  <text x="234" y="138" fill="#111827">12 Ω</text>
  <text x="256" y="252" font-weight="bold" fill="#111827">D8</text>
  <text x="244" y="318" font-weight="bold" fill="#111827">Q1</text>
  <text x="244" y="334" fill="#111827">8050</text>
  <text x="161" y="300" text-anchor="middle" fill="#111827"><tspan font-weight="bold">R9</tspan> 1 kΩ</text>
  <text x="414" y="122" font-weight="bold" fill="#111827">R13</text>
  <text x="414" y="138" fill="#111827">5.6 Ω</text>
  <text x="436" y="192" font-weight="bold" fill="#111827">D5</text>
  <text x="436" y="252" font-weight="bold" fill="#111827">D9</text>
  <text x="424" y="318" font-weight="bold" fill="#111827">Q2</text>
  <text x="424" y="334" fill="#111827">8050</text>
  <text x="341" y="300" text-anchor="middle" fill="#111827"><tspan font-weight="bold">R10</tspan> 1 kΩ</text>
  <text x="594" y="122" font-weight="bold" fill="#111827">R14</text>
  <text x="594" y="138" fill="#111827">5.6 Ω</text>
  <text x="616" y="192" font-weight="bold" fill="#111827">D6</text>
  <text x="616" y="252" font-weight="bold" fill="#111827">D10</text>
  <text x="604" y="318" font-weight="bold" fill="#111827">Q3</text>
  <text x="604" y="334" fill="#111827">8050</text>
  <text x="521" y="300" text-anchor="middle" fill="#111827"><tspan font-weight="bold">R11</tspan> 1 kΩ</text>
  <text x="774" y="122" font-weight="bold" fill="#111827">R15</text>
  <text x="774" y="138" fill="#111827">5.6 Ω</text>
  <text x="796" y="192" font-weight="bold" fill="#111827">D7</text>
  <text x="796" y="252" font-weight="bold" fill="#111827">D11</text>
  <text x="784" y="318" font-weight="bold" fill="#111827">Q4</text>
  <text x="784" y="334" fill="#111827">8050</text>
  <text x="701" y="300" text-anchor="middle" fill="#111827"><tspan font-weight="bold">R12</tspan> 1 kΩ</text>
  <polygon points="112,420 72,420 60,430 72,440 112,440" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="88" y="435" text-anchor="middle" font-weight="bold" fill="#1d4ed8">IO14</text>
  <text x="60" y="458" font-size="11" fill="#6b7280">from MCU · also TP6</text>
  <text x="24" y="496" font-size="12" fill="#374151">Each leg: 5VF → resistor → IR LED(s) → 8050 low-side switch. IO14 high turns the LEDs on (not inverted).</text>
  <text x="24" y="516" font-size="12" fill="#374151">Rough peak current (LED Vf ≈ 1.4 V, Vce(sat) ≈ 0.3 V): ≈ 0.34 A per 5.6 Ω leg, ≈ 0.27 A for the 12 Ω leg, ≈ 1.3 A total.</text>
  <text x="24" y="536" font-size="12" fill="#374151">Base drive ≈ 2.6 mA per transistor at 3.3 V, so about 10 mA from the GPIO. C8 supplies the current peaks.</text>
  <text x="24" y="556" font-size="12" fill="#6b7280">R13–R15 are marked 5R6 (5.6 Ω) on the board; the schematic image appears to say 3.6R. Q1–Q4 are marked J3Y (S8050).</text>
