# VIEWE 4.3" 800*480 ESP32-S3 Smart Display
# https://viewedisplay.com/product/esp32-4-3-inch-800x480-rgb-ips-tft-display-touch-screen-arduino-lvgl/
# https://github.com/VIEWESMART/UEDX80480043ESP32-4.3inch-Touch-Display

# "There is no software difference between UEDX80480043E-WB-A and UEDX80480043E-WB-B."

# SoM is ESP32S3-MCN16R8

# Values from https://github.com/VIEWESMART/UEDX80480043ESP32-4.3inch-Touch-Display/blob/main/Libraries/ESP32_Display_Panel/src/board/supported/viewe/BOARD_VIEWE_UEDX80480043E_WB_A.h

defaults:
  ledc_freq: 4882Hz # 14-bit

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false # enable aggressive optimisations

logger:
  # Use USB bridge
  hardware_uart: UART0

# UART connected to RX/TX pins and USB bridge
uart:
  - id: bus_uart0
    tx_pin: GPIO43
    rx_pin: GPIO44
    baud_rate: 115200

# I2C connected to touch
i2c:
  - id: bus_touch
    scl: GPIO20 # ESP_PANEL_BOARD_TOUCH_I2C_IO_SCL
    sda: GPIO19 # ESP_PANEL_BOARD_TOUCH_I2C_IO_SDA
    frequency: 400kHz # ESP_PANEL_BOARD_TOUCH_I2C_CLK_HZ
    scan: false
    scl_pullup_enabled: false # ESP_PANEL_BOARD_TOUCH_I2C_SCL_PULLUP
    sda_pullup_enabled: false # ESP_PANEL_BOARD_TOUCH_I2C_SDA_PULLUP

# Lights
light:
  - id: led_builtin
    platform: esp32_rmt_led_strip
    name: "Status"
    rgb_order: GRB
    pin:
      number: GPIO0
      ignore_strapping_warning: true
    num_leds: 1
    chipset: ws2812
    restore_mode: ALWAYS_OFF
    entity_category: config
  - id: backlight
    platform: monochromatic
    output: lcd_backlight_pwm
    name: "Backlight"
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    default_transition_length: 500ms

output:
  - id: lcd_backlight_pwm
    platform: ledc
    pin: GPIO2 # ESP_PANEL_BOARD_BACKLIGHT_IO
    frequency: ${ledc_freq}

# # Buttons
# binary_sensor:
#   - id: btn_boot
#     platform: gpio
#     pin:
#       number: GPIO0
#       mode: INPUT_PULLUP
#       inverted: true
#       ignore_strapping_warning: true
#     name: "Boot"
#     filters:
#       - delayed_off: 10ms # debounce
#     entity_category: diagnostic

# Display
display:
  - # 800x480 ST7262 RGB565
    id: display_lcd
    platform: mipi_rgb
    model: RPI
    update_interval: never
    color_order: RGB # ESP_PANEL_BOARD_LCD_COLOR_BGR_ORDER
    invert_colors: false # ESP_PANEL_BOARD_LCD_COLOR_INEVRT_BIT
    pclk_frequency: 15MHz # ESP_PANEL_BOARD_LCD_RGB_CLK_HZ
    dimensions:
      width: 800
      height: 480
    # reset_pin: null # ESP_PANEL_BOARD_LCD_RST_IO
    # enable_pin: null # ??? ESP_PANEL_BOARD_LCD_RGB_IO_DISP
    de_pin: 40 # ESP_PANEL_BOARD_LCD_RGB_IO_DE
    hsync_pin: 39 # ESP_PANEL_BOARD_LCD_RGB_IO_HSYNC
    vsync_pin: 41 # ESP_PANEL_BOARD_LCD_RGB_IO_VSYNC
    pclk_pin: 42 # ESP_PANEL_BOARD_LCD_RGB_IO_PCLK
    pclk_inverted: true # ESP_PANEL_BOARD_LCD_RGB_PCLK_ACTIVE_NEG
    hsync_back_porch: 42 # ESP_PANEL_BOARD_LCD_RGB_HBP
    hsync_front_porch: 20 # ESP_PANEL_BOARD_LCD_RGB_HFP
    hsync_pulse_width: 1 # ESP_PANEL_BOARD_LCD_RGB_HPW
    vsync_back_porch: 12 # ESP_PANEL_BOARD_LCD_RGB_VBP
    vsync_front_porch: 4 # ESP_PANEL_BOARD_LCD_RGB_VFP
    vsync_pulse_width: 10 # ESP_PANEL_BOARD_LCD_RGB_VPW
    data_pins:
      blue:
        - 8 # b0 ESP_PANEL_BOARD_LCD_RGB_IO_DATA0
        - 3 # b1 ESP_PANEL_BOARD_LCD_RGB_IO_DATA1
        - 46 # b2 ESP_PANEL_BOARD_LCD_RGB_IO_DATA2
        - 9 # b3 ESP_PANEL_BOARD_LCD_RGB_IO_DATA3
        - 1 # b4 ESP_PANEL_BOARD_LCD_RGB_IO_DATA4
      green:
        - 5 # g0 ESP_PANEL_BOARD_LCD_RGB_IO_DATA5
        - 6 # g1 ESP_PANEL_BOARD_LCD_RGB_IO_DATA6
        - 7 # g2 ESP_PANEL_BOARD_LCD_RGB_IO_DATA7
        - 15 # g3 ESP_PANEL_BOARD_LCD_RGB_IO_DATA8
        - 16 # g4 ESP_PANEL_BOARD_LCD_RGB_IO_DATA9
        - 4 # g5 ESP_PANEL_BOARD_LCD_RGB_IO_DATA10
      red:
        - 45 # r0 ESP_PANEL_BOARD_LCD_RGB_IO_DATA11
        - 48 # r1 ESP_PANEL_BOARD_LCD_RGB_IO_DATA12
        - 47 # r2 ESP_PANEL_BOARD_LCD_RGB_IO_DATA13
        - 21 # r3 ESP_PANEL_BOARD_LCD_RGB_IO_DATA14
        - 14 # r4 ESP_PANEL_BOARD_LCD_RGB_IO_DATA15

touchscreen:
  - id: touch_lcd
    platform: gt911
    display: display_lcd
    i2c_id: bus_touch
    interrupt_pin: GPIO18 # ESP_PANEL_BOARD_TOUCH_INT_IO
    reset_pin: GPIO38 # ESP_PANEL_BOARD_TOUCH_RST_IO
